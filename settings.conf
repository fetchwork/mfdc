; Минимальный пример для /opt/mfdc/settings.conf
; Полный шаблон: ../settings.conf в корне репозитория
;
; PostgreSQL, bind и reset_admin_passwd. Остальное — UI → Система → Настройки.

[postgresql]
host = 127.0.0.1
port = 5432
user = mfdc_admin
password = mfdc_passwd
dbname = mfdc

[auth]
; jwt_secret — генерируется install.sh (openssl rand -hex 32), если ещё не задан
reset_admin_passwd = true

[rabbitmq]
; локальный брокер (install.sh создаёт user mfdc/mfdc, listener 127.0.0.1:5672)
url = amqp://mfdc:mfdc@127.0.0.1:5672/

[mfdc-api]
bind = 127.0.0.1:8001

[mfdc-broker]
bind = 127.0.0.1:9099
; false — после набора номера брокер запускает att_xfer FreeSWITCH (по умолчанию, работает на проде):
;         # — отмена в любой момент (во время дозвона: origination_cancel_key; после ответа: клавиша att_xfer),
;         * — завершить, 0 — конференция (клавиши att_xfer)
; true  — сопровождаемый перевод ведёт брокер (park/MOH/originate), * во время консультации — отмена
attended_custom = false
; public_url — адрес брокера, доступный С НОДЫ FreeSWITCH (curl из dialplan: rating/callback).
; Обязателен, если брокер не на одном хосте с FS или стоит за HA-nginx
; (install/nginx/mfdc-broker-ha.conf.example). Пример: http://10.0.0.10:9098
; public_url =

[mfdc-runner]
; Петля по умолчанию: на одном хосте сюда ходят nginx (/media/play, /media/preview) и локальный
; FreeSWITCH (playback_url_base = http://127.0.0.1:8011/media/play), а наружу торчать нечему —
; здесь же лежат доставка voicemail/уведомлений и отдача файлов записей, и всё это защищено
; одним общим api.key. В мультинодовой установке, где FS-ноды ходят на runner по сети,
; расширьте адрес и закройте порт файрволом до этих нод.
bind = 127.0.0.1:8011
; fs_name — необязательно: switchname локальной FreeSWITCH (= broker.cdr.fs_name).
; Задайте в мультинодовой установке, чтобы финализатор записей обрабатывал только записи своей ноды.
; Пусто = обрабатывать все, фильтруя по наличию файла на диске.
; fs_name = fs1

[freeswitch]
; mod_http_cache (playback URL). Каталог создаётся на ОС (install-mfdc-runtime.sh или вручную).
; http_cache_dir = /var/cache/freeswitch
; http_cache_owner = freeswitch

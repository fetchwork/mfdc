[rtpengine]

table = 0
# table=0 — kernel forwarding (нужен ngcp-rtpengine-kernel-dkms + modprobe).
# install.sh при отсутствии модуля ставит table=-1 (userspace, без ERR в journal).
# ex = публичный IP сервера (NAT/SDP наружу); in = loopback (FS/OpenSIPS на localhost)
# Имена ex/in совпадают с in-iface=/out-iface= в opensips.cfg
interface = ex/__PUBLIC_IP__;in/127.0.0.1
listen-ng = 127.0.0.1:60000

port-min = 10000
port-max = 19999

timeout = 60
silent-timeout = 3600
tos = 184

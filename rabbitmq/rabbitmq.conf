# AMQP / management — только localhost. Имя узла Erlang сюда не входит:
# его задаёт /etc/rabbitmq/rabbitmq-env.conf (NODENAME=rabbit@localhost).
loopback_users.admin = false
cluster_partition_handling = autoheal
vm_memory_high_watermark.relative = 0.6
# Ниже этого порога свободного места RabbitMQ поднимает resource alarm и замораживает publisher'ов.
# Для платформы это не абстракция: mfdc-broker видит блокировку как «шина событий лежит» и начинает
# отказывать НОВЫМ звонкам с SIP 503 (гейт по потоку событий), чтобы они не прошли мимо CDR.
# 5GB на типовом диске 45-50GB срабатывали задолго до реальной нехватки места — снижено до 2GB.
# Убирать порог совсем нельзя: при по-настоящему кончившемся диске RabbitMQ падает вместе с очередями,
# а это хуже отказа в обслуживании.
disk_free_limit.absolute = 2GB
listeners.tcp.1 = 127.0.0.1:5672
management.tcp.ip = 127.0.0.1
deprecated_features.permit.transient_nonexcl_queues = true

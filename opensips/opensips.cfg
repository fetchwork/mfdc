####### Global Parameters #########
/* uncomment the following lines to enable debugging */
#debug_mode=yes

log_level=3
xlog_level=3
syslog_enabled=yes
stderror_enabled=yes
syslog_facility=LOG_LOCAL0
# Файл: install кладёт rsyslog local0.* → /var/log/opensips.log (+ journalctl -u opensips)

udp_workers=4
open_files_limit=4096
tcp_connection_lifetime=300
tcp_connect_timeout=300

/* uncomment the next line to enable the auto temporary blacklisting of
   not available destinations (default disabled) */
#disable_dns_blacklist=no

/* uncomment the next line to enable IPv6 lookup after IPv4 dns
   lookup failures (default disabled) */
#dns_try_ipv6=yes

/* comment the next line to enable the auto discovery of local aliases
   based on reverse DNS on IPs */
auto_aliases=no

/* set the server to try to locate outbound interface on multihomed host */
mhomed=1

/* Relay the provider's 503 as-is instead of turning it into 500. RFC 3261 16.7 says a proxy should not
   forward a 503 (for the upstream it would mean "the whole service is down", not "this one path failed"),
   and that is why OpenSIPS translates it by default. Disabled deliberately: 503 from a trunk is meaningful
   to us — it lands in the CDR hangup cause and lets FreeSWITCH tell "provider overloaded / out of service"
   apart from a generic 500. The gw_failover branch matches [56][0-9][0-9], so failover keeps working. */
disable_503_translation=true

/* Server&UA */
server_header="Server: MFDC"
user_agent_header="User-Agent: MFDC"

####### Connectivity ########

# ORDER MATTERS: the FIRST socket is what OpenSIPS sends from whenever the script does not force one, so the
# public socket goes first. With the internal link first, everything default-routed left from udp:*:6062 —
# the socket FreeSWITCH reaches us on — and providers saw that internal port as the source of the INVITE
# while Contact and Via advertised the public one.
#
# The consequence is deliberate and platform-wide: requests towards FreeSWITCH now also leave from the first
# public UDP socket. Nothing keys off that — FreeSWITCH is addressed by fs_path and recognised by source IP
# (ds_is_in_list), and "tag internal" is documentation, no script rule selects a socket by it.
#
# install_sip_public_addr also reads the first UDP socket without "tag internal".
#
# ORDER MATTERS: the FIRST socket is the default send socket. Public SIP first; FS link tagged internal.
# install_sip_public_addr reads the first UDP socket without "tag internal".
socket = udp:*:5060
#socket = udp:*:6060
socket = udp:*:6062 tag internal
socket = tcp:*:5060
socket = ws:*:6070
#socket = tls:*:5061
#socket = hep_udp:127.0.0.1:6061
#
# Do NOT add alias= for SIP domains (directory.domains). In-dialog CANCEL/BYE keep RURI host =
# the domain; domain module already marks it "myself", and alias= does not make grep_sock_info()
# find a listen socket for that FQDN on udp:* — you still get after_strict. Silence that with
# rr.enable_socket_mismatch_warning=0 below. Contact/Via/RR use sip_public_addr (IP), not the domain.


####### Routing Logic ########

# startup route logic
startup_route {
	if (!subscribe_event("E_UL_AOR_REGISTER", "rabbitmq:mfdc:mfdc@127.0.0.1/exchange=opensips?sip.register"))
		xlog("L_ERR","cannot the RabbitMQ server subscribe to the E_UL_AOR_INSERT event\n");

	if (!subscribe_event("E_UL_AOR_UNREGISTER", "rabbitmq:mfdc:mfdc@127.0.0.1/exchange=opensips?sip.register"))
		xlog("L_ERR","cannot the RabbitMQ server subscribe to the E_UL_AOR_DELETE event\n");

	if (!subscribe_event("E_DEV_HOTDESK", "rabbitmq:mfdc:mfdc@127.0.0.1/exchange=mfdc?hotdesk"))
		xlog("L_ERR","cannot the RabbitMQ server subscribe to the E_DEV_HOTDESK event\n");

	# Trunk reachability: the dispatcher module already pings probed sets with SIP OPTIONS every 30s
	# (ds_ping_method/ds_ping_interval above). This forwards every state transition to the broker, which
	# stores it in broker.sip_gateway_health. Probing runs HERE and not on FreeSWITCH on purpose: there can be
	# several FS instances, while OpenSIPS is the single network edge that actually faces the provider.
	# Same exchange as the REGISTER events (the broker declares "opensips"; publishing to an exchange nobody
	# declared is silently dropped), different routing key, so the two consumers stay independent.
	if (!subscribe_event("E_DISPATCHER_STATUS", "rabbitmq:mfdc:mfdc@127.0.0.1/exchange=opensips?gateway.health"))
		xlog("L_ERR","cannot subscribe RabbitMQ to the E_DISPATCHER_STATUS event\n");

	# Warm the SIP digest cache so the first REGISTER after start is not a DB round-trip.
	route(load_sip_auth_cache);
}

# Reload sip_subscribers into cachedb_local. When the last load succeeded, sipauth_ok is held
# for 1h and this is a no-op; when it failed (Postgres down at start) we retry every minute
# instead of waiting a full hour with an empty cache.
timer_route[sip_auth_reload, 60] {
	if (cache_fetch("local", "sipauth_ok", $var(sipauth_ok)))
		return;
	route(load_sip_auth_cache);
}

# from local request route logic
local_route {

	if (is_method("BYE") && $DLG_dir=="UPSTREAM") {
#		rtpengine_use_set(1);
		rtpengine_delete();
	}

}

# main request routing logic
route{
# we match the TLS client domain using the SIP domain in the RURI
#$avp(tls_sip_dom) = $rd;

# some scanner mitigation
# check to see if the src ip is flooding us and drop requests accordingly
#if ( !is_myself("$si") && !pike_check_req() ) { exit; }
# check packet for signs that it came from a scanner
	if( $ua=~"^sipvicious"       ||
		$ua=~"^freindly-scanner" ||
		$ua=~"^friendly-scanner" ||
		$ua=~"^VaxSip"           ||
		$ua=~"^sipcli"           )
	{
		xlog("L_NOTICE","Auth error for $ua from $si (scanners) cause -1");
		exit;
	}

# kill any requests that we do not handle
	if (!is_method("UPDATE|PRACK|SUBSCRIBE|NOTIFY|REGISTER|INVITE|ACK|BYE|
		CANCEL|REFER|OPTIONS|INFO|MESSAGE"))
	{
		sl_send_reply(405,"Method Not Allowed");
		exit;
	}

	if (is_method("PUBLISH|SUBSCRIBE")) {
		sl_send_reply(503, "Service Unavailable");
		exit;
	}

# initial NAT handling; detect if the request comes from behind a NAT
# and apply contact fixing
    if (nat_uac_test("diff-port-src-via,diff-ip-src-via")) {
        if (!nat_uac_test("diff-ip-src-via") && $(hdr(Via){via.port}) < 5099)
			xlog("L_DBG", "SCRIPT:DBG NOT forcing rport. Via port is $(hdr(Via){via.port})\n");
		else
			force_rport();
	}
    if (nat_uac_test("diff-port-src-via,private-via,diff-ip-src-via,private-contact")) {
		if (is_method("REGISTER")) {
			fix_nated_register();
			setbflag("NAT");
		} else if ($socket_in(proto) == "ws" || $socket_in(proto) == "wss") {
# consider the WS client is behind NAT - always fix the contact
			fix_nated_contact();
			setflag("NAT");
		} else {
# regular SIP UAC behind NAT: rewrite a private Contact to the public
# source so in-dialog requests (BYE/re-INVITE) reach the phone, not its
# RFC1918 address. Public contacts (carrier trunks) are left untouched.
			if (nat_uac_test("private-contact")) {
				fix_nated_contact();
			}
			setflag("NAT");
		}
	}

	if (is_method("OPTIONS")) {
        sl_send_reply(200, "I See You");
		exit;
    }

	if (!mf_process_maxfwd_header(10)) {
		send_reply(483,"Too Many Hops");
		exit;
	}

# SIP to HOMER
#	route(to_homer);
#	$var(trace_id) = "tid";

	if (has_totag()) {

		if (topology_hiding_match()) {
			route(relay);
			exit;
		}

# preloaded route checking
		if (loose_route()) {

			if ( is_method("ACK") ) {
				if ( t_check_trans() ) {
					t_relay();
					exit;
				} else
				exit;
			}

			route(relay);
			exit;
		}

# sequential request within a dialog should
# take the path determined by record-routing
		if ( !loose_route() ) {
# we do record-routing for all our traffic, so we should not
# receive any sequential requests without Route hdr.
			send_reply(404,"Not here");
			exit;
		}

# validate the sequential request against dialog
		if ( $DLG_status!=NULL && !validate_dialog() ) {
#			exit;
		}
	}

# CANCEL processing
	if (is_method("CANCEL")) {
#		rtpengine_use_set(1);
		rtpengine_delete();
		if (t_check_trans())
			t_relay();
		exit;
	}

# absorb retransmissions, but do not create transaction
	t_check_trans();

	if (is_method("REGISTER"))
		route(is_register);

	if ( !(is_method("REGISTER") ) )
		route(is_not_register);

# preloaded route checking ?? check it
	if (loose_route()) {
		xlog("L_ERR",
			"Attempt to route with preloaded Route's [$fu/$tu/$ru/$ci]");
		if (!is_method("ACK"))
			send_reply(403,"Preload Route denied");
		exit;
	}

# record routing
# Prefer RR = platform public IP:port (sip_public_addr). Domain in RURI on CANCEL is separate and is
# handled by enable_socket_mismatch_warning=0 — do not paper over it with alias=.
# Trunk legs also call public_contact_addr later — setting advertised twice with the same value is fine.
	if (!is_method("REGISTER|MESSAGE")) {
		route(public_contact_addr);
		if (($avp(pubh) != NULL) && ($avp(pubh) != "<null>") && ($avp(pubh) != "") && ($avp(pubh) != "-")
				&& ($avp(pubp) != NULL) && ($avp(pubp) != "<null>") && ($avp(pubp) != "") && ($avp(pubp) != "-")) {
			$var(rr) = $avp(pubh) + ":" + $avp(pubp);
			record_route_preset("$var(rr)");
		} else {
			record_route();
		}
	}
# create dialog on INVITEs
	if (is_method("INVITE")) {

# create dialog with timeout
		if ( !create_dialog("B") ) {
			send_reply(500,"Internal Server Error");
			exit;
		}
# account only INVITEs
#		do_accounting("log");
		#b2b_server_new($ci);
		#b2b_client_new($ci, "sip:fs.example.com:5080",,,"7777");
		#force_send_socket("udp:203.0.113.10:5062");
		#$du="sip:fs.example.com:5080";
		#$ru= "sip:" + $tU + "@fs.example.com:5080" ;
		#append_hf("X-MFDC-Uuid: $ci\r\n");
		#xlog("L_INFO","[$fU $tU $ci $rm] Relaying Request to $ru");
		#xlog("L_INFO","[$fU $tU $ci $rm] Calling function b2b_init");
		#b2b_init_request("top hiding");
		#exit;
	}

	if ($rU==NULL) {
# request with no Username in RURI
		send_reply(484,"Address Incomplete");
		exit;
	}

# do all mfdc staff
	route(check_src_and_dest);

# ?? ckeck it
	if (isbflagset("NAT")) setflag("NAT");

# when routing via usrloc, log the missed calls also
#	do_accounting("log","missed");

	route(relay);
}

route[relay] {
# Detect if UAC is websockets client and set flag for later processing
	if ($socket_in(proto) == "ws" || $socket_in(proto) == "wss")
		setflag("SRC_WS");

	if(is_method("INVITE") || is_method("UPDATE") || is_method("ACK") || is_method("BYE")) {
		t_check_trans();
		if (check_route_param("nat=yes")) setflag("NAT");
		if (check_route_param("ws=yes")) setbflag("DST_WS");
	}

# for INVITEs enable some additional helper routes
	if (is_method("INVITE") || is_method("UPDATE")) {
		t_on_branch("per_branch_ops");
		t_on_reply("handle_reply");
		t_on_failure("call_failure");
	}

	if (is_method("BYE")) {
#		rtpengine_use_set(1);
		rtpengine_delete();
	}

	if (isflagset("NAT")) add_rr_param(";nat=yes");
	if (isflagset("SRC_WS")) add_rr_param(";ws=yes");

	if(!has_totag() && is_method("INVITE")) {
		if (is_present_hf("X-FS-Support")) setflag("FS");
		# Second arg forces Contact username toward the callee (provider). Without it, flag "U" keeps
		# whatever FreeSWITCH put there — and a leg missing sip_contact_user is literally "mod_sofia".
		# $var(gwcontactu) is set in route[is_not_register] for PSTN: contact_user DID, else trunk login.
		if (isbflagset("PSTN")
				&& !(($var(gwcontactu) == NULL) || ($var(gwcontactu) == "<null>")
					|| ($var(gwcontactu) == "") || ($var(gwcontactu) == "-"))) {
			topology_hiding("UC", "/$var(gwcontactu)");
		} else {
			topology_hiding("UC");
		}
	}

	if (!t_relay()) {
		send_reply(500,"Internal Server Error");
	}
	exit;
}

branch_route[per_branch_ops] {
# Detect if UAC is websockets client and set flag for later processing
	xlog("L_DBG","SCRIPT:DBG BRANCH $T_branch_idx, $oP request $ru contact(s) $ct\n$cs\n $rm: message flags: $mf\n branch flags: $bf\n");
	if ($socket_out(proto) == "ws" || $socket_out(proto) == "wss")
		setbflag("DST_WS");
	if ($socket_in(proto) == "ws" || $socket_in(proto) == "wss")
		setflag("SRC_WS");
	resetbflag("sdp_offer");
	if ( (is_method("INVITE") || is_method("UPDATE") || is_method("ACK") || is_method("PRACK")) && has_body("application/sdp") ) {

		if (isbflagset("FS"))
# - to FS
			$var(rtpengine_flags) = "trust-address replace-origin replace-session-connection rtcp-mux-demux ICE=remove RTP/AVP";
		else if (isflagset("SRC_WS") && isbflagset("DST_WS"))
# - Web to web
			$var(rtpengine_flags) = "trust-address replace-origin replace-session-connection SDES-off ICE=force";
		else if (isflagset("SRC_WS") && !isbflagset("DST_WS"))
# - Web to SIP
			$var(rtpengine_flags) = "trust-address replace-origin replace-session-connection rtcp-mux-demux ICE=remove RTP/AVP";
		else if (!isflagset("SRC_WS") && isbflagset("DST_WS"))
# - SIP to web
			$var(rtpengine_flags) = "replace-origin replace-session-connection rtcp-mux-require strict-source ICE=force SDES-off UDP/TLS/RTP/SAVP";
		else if (!isflagset("SRC_WS") && !isbflagset("DST_WS"))
# - SIP to SIP
			$var(rtpengine_flags) = "trust-address replace-origin replace-session-connection rtcp-mux-demux ICE=remove RTP/AVP";

#######################
		if (isflagset("vlan"))
			$var(rtpengine_flags) = $var(rtpengine_flags) + " in-iface=vlan out-iface=in";
		else if (isbflagset("vlan"))
			$var(rtpengine_flags) = $var(rtpengine_flags) + " in-iface=in out-iface=vlan";
		else if (isflagset("FS"))
			$var(rtpengine_flags) = $var(rtpengine_flags) + " in-iface=in out-iface=ex";
		else if (isbflagset("FS"))
			$var(rtpengine_flags) = $var(rtpengine_flags) + " in-iface=ex out-iface=in";
		else
			$var(rtpengine_flags) = $var(rtpengine_flags) + " in-iface=ex out-iface=ex";
#######################

# Codecs
		if (isflagset("PSTN") || isbflagset("PSTN"))
			$var(rtpengine_flags) = $var(rtpengine_flags) + " codec-strip-speex codec-strip-gsm codec-strip-iLBC transcode-PCMA";
		else
			$var(rtpengine_flags) = $var(rtpengine_flags) + " codec-strip-speex codec-strip-gsm codec-strip-iLBC codec-mask-opus codec-mask-G722 codec-mask-PCMA transcode-opus transcode-G722 transcode-PCMA";

		xlog("L_DBG","SCRIPT:DBG $var(reply_log) $cs: $rs: rtpengine $var(rtpengine_flags)\n");
#		rtpengine_use_set(1);
		rtpengine_manage("$var(rtpengine_flags)");
	}
}

onreply_route[handle_reply] {
# Detect if UAC is websockets client and set flag for later processing
	xlog("L_DBG","SCRIPT:DBG $var(reply_log) $cs: $rs: response\nmessage flags: $mf\nbranch flags: $bf\n");
	if (isflagset("SRC_WS") || isbflagset("DST_WS") || isflagset("NAT"))
		fix_nated_contact();
# rtp proxying for responses
	if ( has_body("application/sdp") ) {

		if (isflagset("FS") && isbflagset("DST_WS"))
			$var(rtpengine_flags) = "trust-address replace-origin replace-session-connection ICE=remove RTP/AVP";
		else if (isflagset("SRC_WS") && isbflagset("DST_WS"))
			$var(rtpengine_flags) = "trust-address replace-origin replace-session-connection SDES-off ICE=force";
		else if (isflagset("SRC_WS") && !isbflagset("DST_WS"))
			$var(rtpengine_flags) = "replace-origin replace-session-connection rtcp-mux-require strict-source ICE=force SDES-off RTP/SAVP";
		else if (isflagset("FS"))
			$var(rtpengine_flags) = "trust-address replace-origin replace-session-connection rtcp-mux-demux ICE=remove RTP/AVP direction=public direction=private";
		else
			$var(rtpengine_flags) = "trust-address replace-origin replace-session-connection rtcp-mux-demux ICE=remove RTP/AVP direction=public direction=private";

#######################
		if (isbflagset("vlan"))
			$var(rtpengine_flags) = $var(rtpengine_flags) + " in-iface=vlan out-iface=in";
		else if (isflagset("vlan"))
			$var(rtpengine_flags) = $var(rtpengine_flags) + " in-iface=in out-iface=vlan";
		else if (isbflagset("FS"))
			$var(rtpengine_flags) = $var(rtpengine_flags) + " in-iface=in out-iface=ex";
		else if (isflagset("FS"))
			$var(rtpengine_flags) = $var(rtpengine_flags) + " in-iface=ex out-iface=in";
		else
			$var(rtpengine_flags) = $var(rtpengine_flags) + " in-iface=ex out-iface=ex";
#######################

		xlog("L_DBG","SCRIPT:DBG $var(reply_log) $cs: $rs: rtpengine $var(rtpengine_flags)\n");
#		rtpengine_use_set(1);
		rtpengine_manage("$var(rtpengine_flags)");
	}
}

# Loads the outbound (uac_auth) credentials of the trunk we are calling into the AVPs uac_auth reads.
# Source of truth is public.sip_gateway: a provider may challenge outgoing INVITEs whether or not the trunk
# registers, so the credentials cannot live only in public.registrant. Looked up once per trunk and kept in
# cachedb_local; mfdc-api drops the keys when a trunk changes and the TTL is the safety net (a restart of
# OpenSIPS empties the cache, which simply refills itself on the next challenge).
#
# Keyed by the TRUNK ID and ONLY by it. There is deliberately no lookup by provider address: two trunks of one
# operator share an address — two tele2 accounts, one per city — and any address-based query has to pick one
# of them, which is how a call through Kostanay_tele2 came to authenticate with Shymkent_tele2's credentials.
# Wrong credentials are worse than none: the provider either rejects the call or bills another account.
#
# The id comes from $avp(gwauth_id), stored in route[is_not_register] while X-MFDC-Gateway-Id was still on the
# request (by the time a challenge is answered, the header is gone and $var() no longer holds this call's
# value — the challenge is handled in a failure route). A leg without that tag therefore gets no credentials
# and the caller sees 403: the tag is compiled into the bridge string when a schema is saved, so a schema
# saved by an older mfdc-api has to be re-saved once.
route[gw_outbound_auth] {
	$avp(uac_username) = NULL;
	$avp(uac_password) = NULL;

	if (($avp(gwauth_id) == NULL) || ($avp(gwauth_id) == "") || ($avp(gwauth_id) == "0")) {
		xlog("L_ERR","[$rm][$ci][$route.name][$si:$sp] no trunk id on the leg towards $rd — cannot pick outbound credentials (re-save the schema so the bridge carries X-MFDC-Gateway-Id)\n");
		return;
	}

	# Copied into a $var and the keys built by concatenation — the same shape route[gw_from_identity] uses.
	# Interpolating the AVP straight into the key string is what made every trunk share one cache slot, and a
	# shared slot means the first trunk challenged after a restart lends its login to all the others.
	$var(gwid) = $avp(gwauth_id);
	$var(ck_u) = "mfdc_gwauth_u_" + $var(gwid);
	$var(ck_p) = "mfdc_gwauth_p_" + $var(gwid);

	# avpops is not loaded (sqlops replaced it), so no is_avp_set(): the cache miss is detected by the return
	# value of cache_fetch itself, and an unset AVP is compared the way the reference config does it.
	if (!cache_fetch("local", "$var(ck_u)", $avp(uac_username))) {
		# No trailing ';' — db_postgres prepared statements reject multi-statement (PQexecParams).
		sql_query("SELECT COALESCE(outbound_auth_username,''), COALESCE(outbound_auth_password,'') FROM sip_gateway WHERE id = '$var(gwid)' AND enable = true AND outbound_auth = true LIMIT 1", "$avp(uac_username);$avp(uac_password)");
		if (($avp(uac_username) == NULL) || ($avp(uac_username) == "<null>") || ($avp(uac_username) == "")) {
			return;
		}
		# TTL is only a safety net: mfdc-api drops both keys via MI cache_remove when the trunk is edited,
		# so an hour costs one query per trunk per hour instead of one every five minutes.
		cache_store("local", "$var(ck_u)", "$avp(uac_username)", 3600);
		cache_store("local", "$var(ck_p)", "$avp(uac_password)", 3600);
		xlog("L_NOTICE","[$ci][$route.name] outbound credentials loaded for trunk $var(gwid): user=$avp(uac_username)\n");
	} else {
		# Cache hit on the username — the password lives under its own key and must be fetched too.
		cache_fetch("local", "$var(ck_p)", $avp(uac_password));
	}
}

# The address the provider sees in Contact on an outgoing INVITE.
#
# topology_hiding("UC") replaces the Contact with "the IP address of the interface where the request was
# received" — and a trunk-bound INVITE is received from FreeSWITCH on udp:*:6062 (tag internal), so the
# provider was handed <sip:...@<ip>:6062>: an address that faces FreeSWITCH, not the world. The user part is
# a separate half and is owned by FreeSWITCH (sip_contact_user on the bridge leg, flag "U" keeps it); the
# host and port can only be fixed here. There may be several FreeSWITCH nodes and they may sit in a private
# network — OpenSIPS is the single edge the providers talk to, so the address belongs to the platform
# settings (system.platform_settings.sip_public_addr, the same value the trunk Contact registers with), not
# to a FreeSWITCH profile.
#
# set_advertised_address/set_advertised_port are the right lever rather than force_send_socket: the Contact
# is written by a SUBST_SND lump that is substituted when the message is built, and that substitution reads
# (msg_translator.c) the socket's advertised name first, then set_global_address — what these two functions
# set — and only then the socket's own address. Forcing the socket instead would advertise the port OpenSIPS
# listens on, which is wrong whenever the public port is port-forwarded to it.
#
# Both halves also apply to Via and Record-Route of this request, which is what we want: in-dialog requests
# and responses from the provider have to come back to the same public address. The corollary is that the
# port must actually reach us — either OpenSIPS listens on it or it is forwarded to a socket it listens on.
# Empty setting = leave the socket address in place; a guessed address is worse than the current one.
#
# Cached in cachedb_local like route[gw_from_identity] (one query per TTL, not per call), invalidated by
# mfdc-api when the setting is saved. "-" is the "not configured" sentinel: an empty value cannot be told
# apart from a cache miss. The host/port split is done in SQL so that a bracketed IPv6 literal cannot be cut
# in the middle by a string transformation.
route[public_contact_addr] {
	$avp(pubh) = NULL;
	$avp(pubp) = NULL;

	# Both halves have to come from the cache or neither does: one key can expire before the other, and half
	# an address would advertise the public host on the internal port.
	$var(pubhit) = 0;
	if (cache_fetch("local", "mfdc_sip_pub_h", $avp(pubh))) {
		if (cache_fetch("local", "mfdc_sip_pub_p", $avp(pubp))) {
			$var(pubhit) = 1;
		}
	}
	if ($var(pubhit) == 0) {
		# No trailing ';' — db_postgres prepared statements reject multi-statement (PQexecParams).
		# The split is written with strpos/reverse rather than a regex on purpose: a '$' anywhere in this
		# string would be read by the OpenSIPS config parser as the start of a pseudo-variable, so regex
		# anchors cannot be used here. A bracketed IPv6 literal has no port half by construction.
		sql_query("SELECT CASE WHEN v LIKE '%:%' AND v NOT LIKE '%]%' THEN left(v, length(v) - strpos(reverse(v), ':')) ELSE v END, CASE WHEN v LIKE '%:%' AND v NOT LIKE '%]%' THEN right(v, strpos(reverse(v), ':') - 1) ELSE '-' END FROM (SELECT COALESCE(NULLIF(sip_public_addr, ''), '-') AS v FROM system.platform_settings WHERE id = 1) s LIMIT 1", "$avp(pubh);$avp(pubp)");
		if (($avp(pubh) == NULL) || ($avp(pubh) == "<null>") || ($avp(pubh) == "")) {
			$avp(pubh) = "-";
		}
		if (($avp(pubp) == NULL) || ($avp(pubp) == "<null>") || ($avp(pubp) == "")) {
			$avp(pubp) = "-";
		}
		cache_store("local", "mfdc_sip_pub_h", "$avp(pubh)", 3600);
		cache_store("local", "mfdc_sip_pub_p", "$avp(pubp)", 3600);
		# Once per TTL, not per call: what we resolved is the answer to "why does the provider still see the
		# internal address", and "-" means system.platform_settings.sip_public_addr is empty or unreadable.
		xlog("L_NOTICE","[$time(%d/%m/%yT%H:%M:%S)][$route.name] public SIP address resolved: host=$avp(pubh) port=$avp(pubp)\n");
	}

	if (($avp(pubh) == NULL) || ($avp(pubh) == "<null>") || ($avp(pubh) == "") || ($avp(pubh) == "-")) {
		return;
	}
	set_advertised_address("$avp(pubh)");
	if (($avp(pubp) != NULL) && ($avp(pubp) != "<null>") && ($avp(pubp) != "") && ($avp(pubp) != "-")) {
		set_advertised_port("$avp(pubp)");
		# What we ADVERTISE and where the packet actually LEAVES FROM are two different things, and the trunk
		# needs both. Left alone, OpenSIPS answers FreeSWITCH from the socket FreeSWITCH reached it on —
		# udp:*:6062, the internal link — so the provider saw source port 6062 while the trunk had registered
		# from the public one. Providers pinhole and ACL that pair, and responses come back to it.
		#
		# force_send_socket() cannot be used here: its parameter has a fixup and is resolved at startup
		# (core_cmds.c), so it takes a literal only. $socket_out is the runtime form of the same thing.
		#
		# UDP only, and only when the request itself arrived over UDP: the socket string is built as udp:, and
		# forcing that for a TLS trunk would send it out the wrong transport. Same assumption the registration
		# side already makes (gatewayForcedSocket builds udp:<host>:<port> from this very setting).
		#
		# If OpenSIPS does not listen on that socket (public port merely forwarded to an internal one), the
		# assignment simply does not match and the default socket is used — the advertised address above still
		# puts the right value in Contact/Via, which is the half that must never be wrong.
		# Lowercased before comparing: $socket_in(proto) returns whatever the transport module registered as
		# the protocol name (pvar.c reads protos[].name verbatim), and a mismatch here would skip the socket
		# silently — the one failure mode that looks identical to "the setting does nothing".
		if ($(socket_in(proto){s.tolower}) == "udp") {
			# AVPs do NOT expand inside a quoted $socket_out assignment — that produced the literal
			# "udp:$avp(pubh):$avp(pubp)" (parse_phostport / no socket match) while xlog still printed the
			# real host:port. Build with + like every other runtime URI in this script.
			$var(pubh) = $avp(pubh);
			$var(pubp) = $avp(pubp);
			$socket_out = "udp:" + $var(pubh) + ":" + $var(pubp);
			# $socket_out(forced) is NULL when the assignment matched no socket OpenSIPS listens on. Silent
			# when healthy, loud exactly when the packet is about to leave from the internal port anyway.
			if ($socket_out(forced) == NULL) {
				xlog("L_NOTICE","[$ci][$route.name] cannot send from udp:$var(pubh):$var(pubp) — OpenSIPS does not listen on it; the trunk leg leaves from $socket_out\n");
			}
		}
	}
	xlog("L_DBG","[$ci][$route.name] trunk leg: advertising $avp(pubh):$avp(pubp), sending from $socket_out (forced=$socket_out(forced))\n");
}

# Loads the From identity of the trunk we are calling out through:
#   $avp(fd) — sip_domain when set, otherwise "-" (script uses the dialled R-URI host $rd). Same field as
#              registration AOR (upsertGatewayRegistrant): one domain for REGISTER and INVITE From. Legacy
#              from_domain is only a fallback for rows not yet re-saved after the fields were unified.
#   $avp(fu) — the trunk login when from_user_login is on, "-" otherwise ("keep the caller ID").
#   $avp(cu) — Contact user: contact_user DID, else trunk login, else "-".
#
# Cached 1h in cachedb_local. mfdc-api refreshes on trunk save via MI cache_remove_chunk + cache_store
# (opensips-cli: mi cache_remove_chunk / cache_store). TTL is only the safety net.
# Keys: mfdc_gwfrom_{d,u,c}_<gateway_id> — must match shared/function/opensips_mi.go.
#
# Key building uses string concat from the header (not {s.int} + "…_$var"): an integer left-hand side
# does not concatenate, and a mis-built key means the script keeps a private entry while MI updates
# mfdc_gwfrom_d_<id> — exactly "settings apply only after opensips restart".
route[gw_from_identity] {
	$avp(fd) = NULL;
	$avp(fu) = NULL;
	$avp(cu) = NULL;

	$var(gwid) = $hdr(X-MFDC-Gateway-Id);
	$var(ck_fd) = "mfdc_gwfrom_d_" + $var(gwid);
	$var(ck_fu) = "mfdc_gwfrom_u_" + $var(gwid);
	$var(ck_cu) = "mfdc_gwfrom_c_" + $var(gwid);

	$var(need_sql) = 1;
	if (cache_fetch("local", "$var(ck_fd)", $avp(fd))) {
		cache_fetch("local", "$var(ck_fu)", $avp(fu));
		cache_fetch("local", "$var(ck_cu)", $avp(cu));
		# One key can expire before the others — reload all rather than treating a missing half as "-".
		if (!(($avp(fd) == NULL) || ($avp(fd) == "<null>") || ($avp(fd) == ""))
				&& !(($avp(fu) == NULL) || ($avp(fu) == "<null>") || ($avp(fu) == ""))
				&& !(($avp(cu) == NULL) || ($avp(cu) == "<null>") || ($avp(cu) == ""))) {
			$var(need_sql) = 0;
		}
	}
	if ($var(need_sql) == 1) {
		# No trailing ';' — db_postgres prepared statements reject multi-statement (PQexecParams).
		sql_query("SELECT COALESCE(NULLIF(sg.sip_domain,''), NULLIF(sg.from_domain,''), '-'), CASE WHEN COALESCE(sg.from_user_login, false) THEN COALESCE(NULLIF(sg.outbound_auth_username,''), NULLIF(r.username,''), '-') ELSE '-' END, COALESCE(NULLIF(sg.contact_user,''), NULLIF(sg.outbound_auth_username,''), NULLIF(r.username,''), '-') FROM sip_gateway sg LEFT JOIN registrant r ON r.id = sg.uac_registrar_id WHERE sg.id='$var(gwid)' LIMIT 1", "$avp(fd);$avp(fu);$avp(cu)");
		if (($avp(fd) == NULL) || ($avp(fd) == "<null>") || ($avp(fd) == "")) {
			$avp(fd) = "-";
		}
		if (($avp(fu) == NULL) || ($avp(fu) == "<null>") || ($avp(fu) == "")) {
			$avp(fu) = "-";
		}
		if (($avp(cu) == NULL) || ($avp(cu) == "<null>") || ($avp(cu) == "")) {
			$avp(cu) = "-";
		}
		cache_store("local", "$var(ck_fd)", "$avp(fd)", 3600);
		cache_store("local", "$var(ck_fu)", "$avp(fu)", 3600);
		cache_store("local", "$var(ck_cu)", "$avp(cu)", 3600);
	}
	xlog("L_NOTICE","[$ci][gw_from_identity] gwid=$var(gwid) sql=$var(need_sql) key=$var(ck_fd) fd=$avp(fd) fu=$avp(fu) cu=$avp(cu)\n");
}

failure_route[gw_failover] {
#	rtpengine_use_set(1);
	if (t_was_cancelled()) {
		rtpengine_delete();
		exit;
	}
# failure detection with redirect to next available trunk
	if (t_check_status("(408)|([56][0-9][0-9])")) {
		xlog("L_DBG","SCRIPT:DBG Failed trunk $rd/$du detected \n");
		t_on_failure("gw_failover");
		t_relay();
		exit;
	}
	rtpengine_delete();
	send_reply(500,"No Destination available");
}

failure_route[call_failure] {
	if (t_was_cancelled()) {
		rtpengine_delete();
		exit;
	}
	# Outbound trunk authentication. It lives HERE and not in gw_failover because route[relay] arms
	# t_on_failure("call_failure") for every INVITE/UPDATE it sends — a later t_on_failure overrides an
	# earlier one, so this is the handler that actually runs for a call going out to a trunk.
	# Must stay ABOVE the generic 4xx/5xx cleanup below, which would otherwise tear the RTP session down.
	if (t_check_status("401|407")) {
		# Already authenticated once — the credentials are simply wrong. Retrying would loop.
		if (isflagset("UACAUTH")) {
			xlog("L_INFO","[$rm][$ci][$route.name][$si:$sp] Trunk rejected our credentials for $rU@$rd\n");
			rtpengine_delete();
			send_reply(403,"Invalid credentials for trunk");
			exit;
		}

		# The realm to answer with comes from the challenge itself, not from the host we dialled: providers
		# routinely answer with a realm of their own.
		if ($(<reply>hdr(Proxy-Authenticate))) {
			$var(raw_auth) = $(<reply>hdr(Proxy-Authenticate));
		} else if ($(<reply>hdr(WWW-Authenticate))) {
			$var(raw_auth) = $(<reply>hdr(WWW-Authenticate));
		} else {
			xlog("L_ERR","[$rm][$ci][$route.name][$si:$sp] 401/407 without an authenticate header from $rd\n");
			rtpengine_delete();
			send_reply(500,"No auth header");
			exit;
		}
		$var(reg_start) = "/(.*?)realm=\"//g";
		$var(reg_end) = "/\"(.*)//g";
		$var(raw_auth) = $(var(raw_auth){re.subst,$var(reg_start)});
		$var(raw_auth) = $(var(raw_auth){re.subst,$var(reg_end)});
		$avp(uac_realm) = $var(raw_auth);

		route(gw_outbound_auth);
		if (($avp(uac_username) == "<null>") || ($avp(uac_username) == "")) {
			xlog("L_INFO","[$rm][$ci][$route.name][$si:$sp] No outbound credentials configured for trunk $rd\n");
			rtpengine_delete();
			send_reply(403,"Trunk requires authentication");
			exit;
		}

		# uac_auth() reports only true/false, so the three inputs it reads are logged here — L_DBG because
		# a provider challenges EVERY outgoing INVITE, so this fires once per call. Raise it temporarily
		# when outbound auth needs debugging. The password is shown as its length, never as a value.
		xlog("L_DBG","[$rm][$ci][$route.name] uac_auth inputs: realm=[$avp(uac_realm)] user=[$avp(uac_username)] pass_len=$(avp(uac_password){s.len})\n");

		# uac_auth() only BUILDS the Authorization header into the request (and bumps CSeq) — it sends
		# nothing, so the request has to be relayed again here.
		if (uac_auth()) {
			setflag("UACAUTH");
			xlog("L_INFO","[$rm][$ci][$route.name][$si:$sp] Outbound auth as $avp(uac_username) to $rU@$rd\n");
			t_on_failure("call_failure");
			t_relay();
			exit;
		}
		xlog("L_ERR","[$rm][$ci][$route.name][$si:$sp] uac_auth() failed for $rd (realm=$avp(uac_realm))\n");
		rtpengine_delete();
		send_reply(500,"Trunk authentication failed");
		exit;
	}
	# On non-cancel failures (busy, no answer, error) — clean up RTP and let caller handle
	if (t_check_status("(408)|([456][0-9][0-9])")) {
		rtpengine_delete();
	}
}

event_route[E_UL_AOR_INSERT] {
# [USRLOC] This event is raised when a new AOR is inserted in the USRLOC memory cache.
	$avp(attrs) = "aor";
	$avp(vals) = $param(aor); # The AOR of the inserted record.
#	$avp(attrs) = "tsec";
#	$avp(vals) = $Ts;
#	get_timestamp($avp(sec), $avp(usec));
	$avp(attrs) = "tsec";
	$avp(attrs) = "usec";
# guess this will push two sequential $avp(vals) values
	get_timestamp($avp(vals), $avp(vals));
	if (!raise_event("E_UL_AOR_REGISTER", $avp(attrs), $avp(vals)))
		xlog("L_ERR", "failed to raise E_UL_AOR_INSERT event\n");
	exit;
}

event_route[E_UL_AOR_DELETE] {
# [USRLOC] this event is raised when a new AOR is deleted from the USRLOC memory cache.
	$avp(attrs) = "aor";
	$avp(vals) = $param(aor); # The AOR of the inserted record.
	$avp(attrs) = "tsec";
	$avp(attrs) = "usec";
# guess this will push two sequential $avp(vals) values
	get_timestamp($avp(vals), $avp(vals));
	if (!raise_event("E_UL_AOR_UNREGISTER", $avp(attrs), $avp(vals)))
		xlog("L_ERR", "failed to raise E_UL_AOR_DELETE event\n");
	exit;
}

route[is_register] {
	route(resolve_local_domain, $td);

# Auth fail throttle. Key by AOR ($tU@domain), NOT $si — all WebRTC behind nginx
# shares Received/source 127.0.0.1; IP-based ban would lock out every desk.
	if (cache_fetch("local", "authban_$tU@$var(regdom)", $var(banned))) {
		xlog("L_NOTICE","SECURITY: dropping REGISTER for banned $tU@$var(regdom) from $si ($ua)\n");
		exit;
	}

	route(digest_auth, "www");

	if ($tU != $au) {
		# The AOR being registered must belong to the authenticated user. db_is_to_authorized
		# used to do this with a second sip_subscribers SELECT; after digest_auth the user is
		# already proven, so comparing To-user with the digest username is the same check and
		# does not need PostgreSQL (including the remapped-IP case, where To domain ≠ regdom).
		xlog("L_NOTICE","SECURITY: REGISTER for $tU@$var(regdom) authenticated as $au from $si ($ua)\n");
		send_reply(403,"Forbidden auth ID");
		exit;
	}

	setbflag("KILL_ZOMBIES"); /* for cluster: disable on the secondary: nh_enable_ping */
	# Per-transport contact limit: at most one WS and one classic SIP registration.
	# Drop previous contacts of the same transport (WebRTC Contact URI changes every login).
	if ($socket_in(proto) == "ws" || $socket_in(proto) == "wss") {
		setbflag("DST_WS");
		fix_nated_register();
		route(rm_aor_contacts_by_transport, "ws");
	} else {
		setbflag("DST_SIP");
		route(rm_aor_contacts_by_transport, "sip");
	}
	if ($socket_in(proto) == "tcp" || $socket_in(proto) == "tls")
		setflag("TCP_PERSISTENT");

	# usrloc attr = directory.devices.id. Prefer the hourly cache; fall back to one SELECT.
	if ($avp(uid) == NULL || $avp(uid) == "<null>" || $avp(uid) == "") {
		if (!cache_fetch("local", "sipuid_$au@$var(regdom)", $avp(uid))) {
			sql_query("SELECT id FROM sip_subscribers WHERE domain = '$var(regdom)' AND username = '$au' LIMIT 1", "$avp(uid)");
		}
	}
	$avp(attr) = $avp(uid);

	# force-registration: safety net for max_contacts=2.
	# The AOR is spelled out instead of being taken from the To header: a legacy phone sent our IP there, and
	# a contact saved as 101@<ip> is invisible to every lookup, which all use the domain.
	if (!save("location", "force-registration", "sip:$tU@$var(regdom)"))
		sl_reply_error();
	exit;
}

# Load sip_subscribers into cachedb_local. Key sipauth_<user>@<domain> = plaintext password
# (pv_www_authorize / calculate_ha1), sipuid_<user>@<domain> = device id (usrloc attr).
# Expire 3600s: the timer holds sipauth_ok for the same hour, then reloads; deleted AORs
# drop out when their key expires. mfdc-api also cache_remove's a key on password change.
route[load_sip_auth_cache] {
	# sql_query ADDS rows onto the AVP stacks. The timer process keeps them between ticks:
	# one `$avp(x)=NULL` pops a single leftover, then columns desync on the next load.
	while ($avp(sa_u))
		$avp(sa_u) = NULL;
	while ($avp(sa_d))
		$avp(sa_d) = NULL;
	while ($avp(sa_p))
		$avp(sa_p) = NULL;
	while ($avp(sa_id))
		$avp(sa_id) = NULL;
	sql_query("SELECT username, domain, password, id FROM sip_subscribers WHERE username IS NOT NULL AND username <> '' AND domain IS NOT NULL AND domain <> '' AND password IS NOT NULL AND password <> ''", "$avp(sa_u);$avp(sa_d);$avp(sa_p);$avp(sa_id)");
	# -1 error; -2 empty result (fresh platform, no subscribers) — still mark the cache loaded
	# so the timer does not retry every minute as if Postgres were down.
	if ($retcode == -1) {
		xlog("L_ERR","sip auth cache: failed to load sip_subscribers\n");
		return;
	}
	$var(n) = 0;
	while ($avp(sa_u)) {
		$var(ck) = "sipauth_" + $avp(sa_u) + "@" + $avp(sa_d);
		$var(ik) = "sipuid_" + $avp(sa_u) + "@" + $avp(sa_d);
		cache_store("local", "$var(ck)", "$avp(sa_p)", 3600);
		cache_store("local", "$var(ik)", "$avp(sa_id)", 3600);
		$var(n) = $var(n) + 1;
		$avp(sa_u) = NULL;
		$avp(sa_d) = NULL;
		$avp(sa_p) = NULL;
		$avp(sa_id) = NULL;
	}
	cache_store("local", "sipauth_ok", "1", 3600);
	xlog("L_NOTICE","sip auth cache: loaded $var(n) subscribers\n");
}

# Digest against the hourly cache. $param(1) is www (REGISTER) or proxy (INVITE).
# Cache hit → pv_*_authorize (no DB). Miss → auth_db, then remember the password.
# Ban (REGISTER only) counts -1 unknown user and -2 wrong password. A DB / HA1 error is -5:
# both auth_db and pv_*_authorize already sent 500 (docs saying "no reply" are wrong —
# authorize.c / auth_mod.c both call sigb.reply 500). Must not increment the fail
# counter and must not challenge (that would be a second reply).
route[digest_auth] {
	$var(auth_via) = $param(1);

	if ($au == NULL || $au == "<null>" || $au == "") {
		if ($var(auth_via) == "www") {
			www_challenge("$var(regdom)", "auth,auth-int");
		} else {
			proxy_challenge("$var(regdom)", "auth");
		}
		exit;
	}

	# username_spec is compared to digest username.whole (auth_mod.c auth_get_ha1).
	# $au is only the user part; $aU is the whole field. A phone that sends
	# username="700@domain" would otherwise look like an unknown user on every cache hit.
	$var(auth_user) = $aU;
	if ($var(auth_user) == NULL || $var(auth_user) == "")
		$var(auth_user) = $au;
	$var(auth_ck) = "sipauth_" + $au + "@" + $var(regdom);
	$var(auth_ik) = "sipuid_" + $au + "@" + $var(regdom);

	if (cache_fetch("local", "$var(auth_ck)", $var(auth_pass))) {
		if ($var(auth_via) == "www") {
			if (pv_www_authorize("$var(regdom)")) {
				cache_fetch("local", "$var(auth_ik)", $avp(uid));
				return;
			}
		} else {
			if (pv_proxy_authorize("$var(regdom)"))
				return;
		}
		if ($retcode == -1 || $retcode == -2) {
			if ($var(auth_via) == "www")
				route(register_auth_fail);
		} else if ($retcode == -5) {
			# pv_*_authorize already sent 500 (auth_get_ha1 error). A challenge here is a double reply.
			exit;
		}
		if ($var(auth_via) == "www") {
			www_challenge("$var(regdom)", "auth,auth-int");
		} else {
			proxy_challenge("$var(regdom)", "auth");
		}
		exit;
	}

	$avp(sip_pass) = NULL;
	$avp(sip_uid) = NULL;
	if ($var(auth_via) == "www") {
		if (www_authorize("$var(regdom)", "sip_subscribers")) {
			route(remember_sip_auth);
			return;
		}
	} else {
		if (proxy_authorize("$var(regdom)", "sip_subscribers")) {
			route(remember_sip_auth);
			return;
		}
	}
	if ($retcode == -1 || $retcode == -2) {
		if ($var(auth_via) == "www")
			route(register_auth_fail);
		if ($var(auth_via) == "www") {
			www_challenge("$var(regdom)", "auth,auth-int");
		} else {
			proxy_challenge("$var(regdom)", "auth");
		}
		exit;
	}
	if ($retcode == -3) {
		if ($var(auth_via) == "www") {
			www_challenge("$var(regdom)", "auth,auth-int");
		} else {
			proxy_challenge("$var(regdom)", "auth");
		}
	}
	exit;
}

route[remember_sip_auth] {
	if (!($avp(sip_pass) == NULL || $avp(sip_pass) == "<null>" || $avp(sip_pass) == "")) {
		cache_store("local", "$var(auth_ck)", "$avp(sip_pass)", 3600);
	}
	if (!($avp(sip_uid) == NULL || $avp(sip_uid) == "<null>" || $avp(sip_uid) == "")) {
		cache_store("local", "$var(auth_ik)", "$avp(sip_uid)", 3600);
		$avp(uid) = $avp(sip_uid);
	}
}

route[register_auth_fail] {
	xlog("L_NOTICE","Auth error for $fU@$fd from $si ($ua) cause $retcode");
	cache_add("local", "authfail_$tU@$var(regdom)", 1, 3600, $var(fails));
	if ($var(fails) >= 3) {
		cache_store("local", "authban_$tU@$var(regdom)", "1", 3600);
		xlog("L_NOTICE","SECURITY: banned $tU@$var(regdom) for 1h after $var(fails) failed REGISTER auth attempts from $si\n");
		exit;
	}
}

# Legacy phones put the server address in the URI instead of the SIP domain: To: <sip:101@203.0.113.10>.
# Everything downstream keys off that domain — the digest realm, the subscriber lookup, the AOR written to
# usrloc, the device lookup on an outgoing call — so such a phone matches nothing, and even if it did its
# contact would land in location under the IP where no call can find it.
#
# $var(regdom) is the domain the request is processed under: the one the phone sent when it is a real local
# domain, the DEFAULT domain when the phone addressed us by our own receiving IP. Called with $td for a
# REGISTER (the AOR being registered) and with $fd for everything else (who is calling).
#
# Only our own address is accepted as that alias, never an arbitrary unknown domain. This is not a way in:
# the phone still has to present valid credentials of a user that exists in the default domain.
route[resolve_local_domain] {
	$var(regdom) = $param(1);
	if (is_domain_local($param(1)))
		return;
	# Our own address, as the phone could have seen it: the IP of the socket the request arrived on, or the
	# advertised one when the box sits behind NAT. $socket_in is used rather than a hardcoded address because
	# the sockets are bound with a wildcard and the box may have several.
	if ($param(1) != $socket_in(ip) && $param(1) != $socket_in(advertised_ip))
		return;
	# Cached: a registration refresh happens every minute per phone and the default domain never changes
	# within an hour (см. правило «без запросов к БД на звонок»).
	if (cache_fetch("local", "mfdc_default_domain", $var(defdom))) {
		$var(regdom) = $var(defdom);
		return;
	}
	# is_default is the admin's explicit choice (Лицензии → Домены). ORDER BY … , id keeps a pre-flag
	# installation working: with nothing marked it falls back to the first domain, which is what the resolver
	# did before the flag existed.
	sql_query("SELECT domain FROM directory.domains WHERE domain IS NOT NULL AND domain <> '' ORDER BY is_default DESC, id LIMIT 1", "$avp(defdom)");
	if ($avp(defdom) == NULL)
		return;
	$var(regdom) = $avp(defdom);
	cache_store("local", "mfdc_default_domain", "$var(regdom)", 3600);
}

# Remove existing usrloc contacts for $tU@$var(regdom) that match transport class (ws|sip).
# Uses contact URI match (compatible without remove() bflag).
# The domain is the RESOLVED one (route[reg_domain]), not the To domain: for a legacy phone that addressed
# us by IP the contacts live under the default domain, and looking them up by the IP would find nothing —
# every refresh would then add a contact instead of replacing one, until max_contacts evicted the live one.
route[rm_aor_contacts_by_transport] {
	if ($param(1) == "ws") {
		sql_query("SELECT contact FROM location WHERE username = '$tU' AND domain = '$var(regdom)' AND (contact LIKE '%transport=ws%' OR contact LIKE '%transport=wss%') LIMIT 10", "$avp(rm_ct)");
	} else {
		sql_query("SELECT contact FROM location WHERE username = '$tU' AND domain = '$var(regdom)' AND contact NOT LIKE '%transport=ws%' AND contact NOT LIKE '%transport=wss%' LIMIT 10", "$avp(rm_ct)");
	}
	while ($avp(rm_ct)) {
		remove("location", "sip:$tU@$var(regdom)", $avp(rm_ct));
		$avp(rm_ct) = NULL;
	}
}

# X-MFDC-* are internal routing metadata between mfdc-broker, FreeSWITCH and this proxy. They must never
# leave towards a provider: they expose the schema/route/domain/user ids of the installation and some trunks
# reject or log unknown headers. Removed ONLY on trunk-bound requests — the same headers are what carry the
# call context to an operator's INVITE on internal legs (X-MFDC-Call-Uuid), so a blanket strip would break
# the desk.
route[strip_mfdc_headers] {
	route(drop_mfdc_metadata);
	# FreeSWITCH advertises itself with X-FS-Support. route[relay] uses it to set the FS flag, so it is
	# consumed by then — but the provider has no business seeing it. NOT part of drop_mfdc_metadata: on
	# ingress that flag is still ahead of us.
	remove_hf("X-FS-Support");
	# Sofia adds Remote-Party-ID unless the leg says otherwise; the leg does (sip_cid_type=none), this is the
	# belt-and-braces for trunks reached through a path that did not set it. Also NOT part of
	# drop_mfdc_metadata: on an INCOMING provider INVITE RPID may legitimately carry the caller identity.
	remove_hf("Remote-Party-ID");
}

# The X-MFDC-* names themselves, in ONE place: they are removed on the way OUT to a provider (above) and on
# the way IN from anything that is not a FreeSWITCH node (route[is_not_register]). Two hand-kept copies of
# this list would drift, and a name missing from either copy fails silently — outbound it leaks, inbound it
# stays forgeable.
#
# Why strip on ingress at all: nothing outside the platform has any business sending these, and they decide
# how the call is routed. append_hf() ADDS, it does not replace, so without this a request arriving with its
# own X-MFDC-Direction / X-MFDC-User-Id reached FreeSWITCH carrying BOTH the forged value and ours, and which
# one wins is then a matter of how mod_sofia folds duplicate headers into sip_h_* — not something to leave to
# chance when the answer decides whether an inbound call is routed by OUTBOUND rules on behalf of somebody
# else's extension (billable), and whether its leg gets armed for on-phone transfer.
#
# Names are listed explicitly rather than matched by prefix: remove_hf() is unambiguous and removes every
# occurrence of the name, and a new header must be added here consciously.
route[drop_mfdc_metadata] {
	remove_hf("X-MFDC-Uuid");
	remove_hf("X-MFDC-Call-Uuid");
	remove_hf("X-MFDC-Domain-Id");
	remove_hf("X-MFDC-User-Id");
	remove_hf("X-MFDC-Extension");
	remove_hf("X-MFDC-Direction");
	remove_hf("X-MFDC-Origin");
	remove_hf("X-MFDC-Schema-Id");
	remove_hf("X-MFDC-Outbound-Route-Id");
	remove_hf("X-MFDC-Outbound-Route");
	remove_hf("X-MFDC-Queue-Id");
	remove_hf("X-MFDC-Gateway-Id");
	remove_hf("X-MFDC-Gateway");
}

route[is_not_register] {
	xlog("L_NOTICE","[$time(%d/%m/%yT%H:%M:%S)][$ci][$route.name][$rm][$si:$sp]\n");
	# A phone that registered by our IP calls with that same IP in From, so the "own domain" branch below has
	# to recognise it the same way the registration did — otherwise it registers fine and every call it makes
	# is answered with 403.
	route(resolve_local_domain, $fd);
	if ( ds_is_in_list("$si", $sp, 1) ) { # from freeswitch
		xlog("L_NOTICE","[$time(%d/%m/%yT%H:%M:%S)][$ci][$route.name][$rm][$si:$sp] From Freeswitch\n");
		setflag("FS");
		# Cleared unconditionally, BEFORE the branch that fills it. Two reasons, both of which produced wrong
		# credentials on the wire: an AVP assignment ADDS a value rather than replacing it (the reference
		# route[gw_from_identity] clears its AVPs the same way), and a leg that carries NO trunk tag must not
		# inherit the id of whatever call this worker handled before it — that is how every trunk ended up
		# authenticating with one and the same login.
		$avp(gwauth_id) = NULL;
		# Trunk from host
		# A leg marked as an internal delivery is NEVER trunk-bound, whatever headers it happens to carry.
		#
		# An inbound call arrives on a trunk, so its A-leg holds X-MFDC-Gateway-Id (the dialplan sets it as a
		# channel variable for the CDR), and that id was reaching the leg FreeSWITCH builds towards the
		# extension. This branch then treated a call to a phone as a call to a provider: it took the trunk's
		# identity and, with "login as CallerID" on, rewrote From to the trunk login — so the extension showed
		# the trunk login instead of the person calling. It also spent a cache/DB lookup and forced the public
		# advertised address on a purely internal INVITE.
		#
		# X-MFDC-Direction=internal is set by every internal leg the platform builds (InternalBridgeSipHeaders
		# and InternalExtensionOriginateVars — direct calls, device groups, queue offers, campaign legs), and
		# route[check_src_and_dest] already routes by the same header, so the two agree by construction.
		if ($(hdr(X-MFDC-Gateway-Id){s.int}) && $(hdr(X-MFDC-Direction)[0]) != "internal") {
			setbflag("PSTN");
			# The trunk this leg leaves on, kept in an AVP rather than a $var: the outbound-auth challenge is
			# handled in a failure route, where $var() no longer holds this call's value, and by then
			# X-MFDC-Gateway-Id itself is gone (strip_mfdc_headers). AVPs are attached to the transaction and
			# survive into failure_route, which is where route[gw_outbound_auth] reads it.
			$avp(gwauth_id) = $(hdr(X-MFDC-Gateway-Id){s.int});
			# Known trunk: always rewrite From so FreeSWITCH's fs_path loopback (127.0.0.1) never reaches the
			# provider. sip_domain (avp fd) overrides the R-URI host when set. from_user_login (avp fu): when
			# on, From user = trunk login; when off ("-"), keep $fU — the caller ID FreeSWITCH sent
			# (effective_caller_id_number / route caller id), including on registering trunks.
			route(gw_from_identity);
			# Contact username for topology_hiding in route[relay]: DID (contact_user) or trunk login.
			# Remembered BEFORE uac_replace_from — that rewrite can change $fU and would steal the wrong user.
			$var(gwcontactu) = $avp(cu);
			# Trunk-bound: the Contact topology_hiding builds must carry the platform's public address, not
			# the internal socket this INVITE arrived on from FreeSWITCH.
			route(public_contact_addr);
			# Copy into $var before comparing: AVP != "-" has been flaky across OpenSIPS builds when the
			# value came from sql_query, and a failed compare left CallerID as the number while the domain
			# half (same route) still rewrote — exactly "SIP domain works, login as CallerID does not".
			$var(fu) = $avp(fu);
			$var(fd) = $avp(fd);
			$var(fromu) = $fU;
			if ($var(fu) != "-") {
				$var(fromu) = $var(fu);
			}
			# Default From domain = Request-URI host (what FreeSWITCH dialled). Explicit sip_domain wins.
			$var(fromd) = $rd;
			if ($var(fd) != "-") {
				$var(fromd) = $var(fd);
			}
			# Never build sip:@host — empty user part is worse than leaving FreeSWITCH's From alone.
			if (($var(fromu) == NULL) || ($var(fromu) == "<null>") || ($var(fromu) == "")
					|| ($var(fromd) == NULL) || ($var(fromd) == "<null>") || ($var(fromd) == "")) {
				xlog("L_WARN","[$ci][$route.name] skip From rewrite: empty user/domain (fu=$var(fu) fd=$var(fd) fU=$fU rd=$rd)\n");
			} else {
				$var(fromuri)='sip:'+$var(fromu)+'@'+$var(fromd);
				xlog("L_NOTICE","[$ci][$route.name] From rewrite gw=$var(gwid) → $var(fromuri) (fu=$var(fu) fd=$var(fd) cu=$var(gwcontactu))\n");
				uac_replace_from("", $var(fromuri));
				# Marks From as already set for this request so the X-MFDC-Direction=outbound branch below
				# does not call uac_replace_from again ("scripting bug: already called") and wipe the trunk
				# SIP-domain / login rewrite with sip:$fU@$td.
				setflag("GW_FROM");
			}
		} else if (!is_domain_local($rd)) {
			# Leaving the platform without a trunk tag on the leg. The tag is compiled into the bridge dial
			# string when the schema is saved, so a schema saved by an older mfdc-api carries none — and the
			# INVITE would go out from the internal socket, which is exactly the topology we hide. That the
			# request URI domain is not one of ours is proof enough, and it does not depend on when anything
			# was compiled. Only the send socket / advertised address is set here; the From identity still
			# needs the tag, because only it says WHICH trunk.
			route(public_contact_addr);
		}
	} else if (is_domain_local($var(regdom))) { # check from domain valid by domain (resolved, see above)
		xlog("L_NOTICE","[$time(%d/%m/%yT%H:%M:%S)][$ci][$route.name][$rm][$si:$sp] From valid domain user\n");
		# A phone sends no X-MFDC-*; anything present here was put there by whoever wrote the INVITE. Drop it
		# BEFORE the append_hf() calls below, so the identity this branch stamps (X-MFDC-User-Id from the
		# authenticated extension) is the only one on the request and cannot be doubled by a forged copy.
		# Credentials for this branch are checked just below — the strip costs nothing and does not depend on
		# that outcome, so it runs first.
		route(drop_mfdc_metadata);
		# Realm passed explicitly for the same reason as in route[is_register]: it equals the From domain for
		# everybody, and the default domain for a phone that authenticated by our IP.
		route(digest_auth, "proxy");
		if ($fU != $au) {
			# Same check db_is_from_authorized used to do with a second sip_subscribers SELECT.
			xlog("L_NOTICE","SECURITY: call from $fU@$var(regdom) authenticated as $au from $si ($ua)\n");
			send_reply(403,"Forbidden auth ID");
			exit;
		}

		consume_credentials();
		# caller authenticated
		xlog("L_DBG", "SCRIPT:DBG Caller is authenticated\n");
		# Auth hotdesk device with extension
		if (is_method("INVITE")) {
			$var(dnum) = $rU;
			if ($(var(dnum){s.substr,0,4})=="*11*") {
                lookup("location", "method-filtering", $fu);
				xlog("L_DBG", "SCRIPT:DBG HOTDESK '$var(dnum)': dev is $avp(attr) and ext is $(var(dnum){s.substr,4,0})\n");
				$avp(attrs) = "id";
				$avp(vals) = $avp(attr);
				if ($(var(dnum){s.substr,4,0})) {
					$avp(attrs) = "auth";
					$avp(vals) = $(var(dnum){s.substr,4,0});
				}
				if (!raise_event("E_DEV_HOTDESK", $avp(attrs), $avp(vals))) {
					xlog("L_ERR", "cannot raise E_DEV_HOTDESK event\n");
				}
				send_reply(402,"MFDC hotdesk");
				exit;
			}
		}
		# Find the extension in directory.devices. SIP REGISTER only proves the AOR is in usrloc —
		# this board's green pill is that. Outbound still needs the directory row: domain + username
		# (and permit_outbound_call). Do NOT require d.uid: extensions without a bound auth.users row
		# are valid PBX lines; treating COALESCE(uid,0)==0 as "not registered" rejected them with
		# 403 after a successful digest (407 → INVITE+auth → 403), which looked like an intermittent
		# registration fault. Prefer $au (digest identity) over $fU so a From display mismatch cannot
		# miss the row. Clear the AVPs first: a previous sql_query that returned zero rows leaves them
		# unset, but a partial failure can leave stale values that pass the "found" check wrongly.
		$avp(uid) = NULL;
		$avp(domain_id) = NULL;
		$avp(ext) = NULL;
		$avp(dev_permit) = NULL;
		sql_query("SELECT COALESCE(d.uid, 0)::int, COALESCE(d.domain_id, 0)::int, COALESCE(d.username, ''), CASE WHEN COALESCE(d.permit_outbound_call, true) THEN 1 ELSE 0 END FROM directory.devices d JOIN directory.domains dom ON dom.id = d.domain_id WHERE dom.domain = '$var(regdom)' AND d.username = '$au' AND d.deleted_at IS NULL LIMIT 1", "$avp(uid);$avp(domain_id);$avp(ext);$avp(dev_permit)");
		if (($avp(domain_id) == NULL) || ($avp(domain_id) == "<null>") || ($avp(domain_id) == 0) || ($avp(ext) == NULL) || ($avp(ext) == "<null>") || ($avp(ext) == "")) {
			xlog("L_NOTICE", "MFDC device not found for $au@$var(regdom) (From $fU@$fd)\n");
			send_reply(403, "Device not registered in MFDC");
			exit;
		}
		if (($avp(dev_permit) == NULL) || ($avp(dev_permit) == "<null>") || ($avp(dev_permit) == 0)) {
			xlog("L_NOTICE", "MFDC outbound denied for $au@$var(regdom) (permit_outbound_call=false)\n");
			send_reply(606, "Not Acceptable");
			exit;
		}

		# Потолок длины набранного номера. E.164 разрешает 15 цифр, 18 — запас на префиксы и «+».
		#
		# Проверка стоит ИМЕННО ЗДЕСЬ, а не в диалплане: OpenSIPS — единственная точка, через которую
		# проходят и SIP-телефоны, и WebRTC, и она срабатывает ДО того, как FreeSWITCH создаст канал.
		# Брокер отбил бы такой номер позже (ни одно правило исходящих маршрутов под него не подходит),
		# но канал к тому моменту уже существует, а вместе с ним строка в broker.calls — и она остаётся
		# висеть «Дозвоном» на доске активных звонков: staging принимает номер любой длины (dst — это
		# character varying без ограничения), а broker.cdr.callee — varchar(64), поэтому запись CDR по
		# такому звонку падает с «value too long», транзакция откатывается и удаление staging-строки
		# вместе с ней. Дальше её убирает только почасовая чистка «зависших» через 12 часов.
		#
		# Практический источник таких номеров — залипшая или зажатая клавиша: в поле набора и на
		# клавиатуре автоповтор даёт сотни одинаковых цифр подряд.
		#
		# 404, а не 484 Address Incomplete: 484 означает «донаберите ещё» и заставит телефон продолжать
		# overlap-набор. Фраза в ответе своя, чтобы отличать этот отказ в трейсах от обычного «номер
		# не найден». Гейт только на INVITE — через этот же маршрут ходят MESSAGE (чат).
		if (is_method("INVITE") && $(rU{s.len}) > 18) {
			xlog("L_WARNING", "MFDC dialled number too long: $(rU{s.len}) chars from $au@$var(regdom) (si=$si) — rejected\n");
			send_reply(404, "Number Too Long");
			exit;
		}

		# Outbound from a directory extension (uid may be 0 — not bound to a platform user).
		setflag("DEV");
		# From is rewritten to the resolved domain, so FreeSWITCH, the CDR and the callee all see the real
		# SIP identity instead of the IP the legacy phone happened to dial.
		$var(fromuri)='sip:'+$avp(ext)+'@'+$var(regdom);
		uac_replace_from("", $var(fromuri));
		append_hf("X-MFDC-Uuid: $ci\r\n");
		append_hf("X-MFDC-Domain-Id: $avp(domain_id)\r\n");
		# Prefer the platform user id when the extension is bound; otherwise put the extension itself so
		# mfdc-broker can resolve permit_outbound / outbound routes. Sending literal "0" (COALESCE of a
		# NULL uid) made the broker look up device "0", deny, and FreeSWITCH answer 603 Decline.
		if ($avp(uid) > 0) {
			append_hf("X-MFDC-User-Id: $avp(uid)\r\n");
		} else {
			append_hf("X-MFDC-User-Id: $avp(ext)\r\n");
		}
		append_hf("X-MFDC-Direction: outbound\r\n");
		append_hf("X-MFDC-Origin: user\r\n");
		# The extension itself, as authenticated above. X-MFDC-User-Id is a reference the broker has to resolve
		# (auth uid, device id or username), and a uid equal to ANOTHER device's id resolved to that device —
		# outbound routes were then picked by the wrong extension's device groups. The broker prefers this one.
		append_hf("X-MFDC-Extension: $avp(ext)\r\n");
	} else { # from PSTN
		xlog("L_NOTICE","[$time(%d/%m/%yT%H:%M:%S)][$ci][$route.name][$rm][$si:$sp] From PSTN\n");
		# Same as the device branch, and this is the side that matters most: a provider (or anyone who can put
		# an INVITE on a trunk's address:port over UDP) must not be able to declare the direction, the domain
		# or on whose behalf the call is routed. This branch appends X-MFDC-Direction: inbound below — after
		# the strip that is the only copy on the request.
		route(drop_mfdc_metadata);
		# No trailing ';' — db_postgres prepared statements reject multi-statement (PQexecParams).
		# registrant.state is the ADMIN flag (0 = enabled, 1 = disabled), see the uac_registrant modparams
		# above — uac_registrant does NOT write its runtime state back to the table. The old condition
		# "uac.state = 3" (REGISTERED_STATE) therefore never matched a single row, so a call arriving on a
		# registrant trunk was never recognised as "From Gateway". Match "not disabled" instead; whether the
		# trunk is enabled at all is already answered by sipgw.enable.
		sql_query("SELECT sipgw.id, sipgw.name, sipgw.domain_id FROM registrant uac JOIN sip_gateway sipgw ON uac.id = sipgw.uac_registrar_id WHERE uac.binding_uri LIKE 'sip:$rU@$rd%' AND uac.state <> 1 AND sipgw.enable = true ORDER BY sipgw.id LIMIT 1", "$avp(id);$avp(name);$avp(domain_id)");
		if ( $avp(id) > 0 ) { # From Gateway
			xlog("L_NOTICE","[$time(%d/%m/%yT%H:%M:%S)][$ci][$route.name][$rm][$si:$sp] From Gateway\n");
			#route(check_limits,$avp(dc));
			setflag("PSTN");

			append_hf("X-MFDC-Gateway-Id: $avp(id)\r\n");
			append_hf("X-MFDC-Gateway: $avp(name)\r\n");
			append_hf("X-MFDC-Domain-Id: $avp(domain_id)\r\n");
			append_hf("X-MFDC-Uuid: $ci\r\n");
			append_hf("X-MFDC-Direction: inbound\r\n");
			append_hf("X-MFDC-Origin: gateway\r\n");
		} else if (check_address(1,"$si",$sp,"$socket_in(proto)")) { # From SIP Trunk
			xlog("L_NOTICE","[$time(%d/%m/%yT%H:%M:%S)][$ci][$route.name][$rm][$si:$sp] SIP Trunk\n");

			sql_query("SELECT sipgw.id, sipgw.name, sipgw.domain_id FROM address uas JOIN sip_gateway sipgw ON uas.id = sipgw.address_id WHERE uas.grp = 1 AND sipgw.enable = true AND uas.ip = '$si' AND ('$si')::inet <<= uas.cidr AND coalesce(nullif(uas.port, 0), $sp) = $sp AND coalesce(nullif(uas.proto, 'any'), '$socket_in(proto)') = '$socket_in(proto)' ORDER BY sipgw.id LIMIT 1", "$avp(id);$avp(name);$avp(domain_id)");
			if ( $avp(id) > 0 ) {

				#		route(check_limits,$avp(dc));
				setflag("PSTN");
				append_hf("X-MFDC-Gateway-Id: $avp(id)\r\n");
				append_hf("X-MFDC-Gateway: $avp(name)\r\n");
				append_hf("X-MFDC-Domain-Id: $avp(domain_id)\r\n");
				append_hf("X-MFDC-Uuid: $ci\r\n");
				append_hf("X-MFDC-Direction: inbound\r\n");
				append_hf("X-MFDC-Origin: gateway\r\n");
				
			} else { # From unknown host
					send_reply(403,"Forbidden auth host");
					xlog("L_NOTICE","Auth error for $fU@$fd from $si (host) cause -1");
					exit;
			}

		} else { # From unknown IP
				xlog("L_NOTICE","[$time(%d/%m/%yT%H:%M:%S)][$ci][$route.name][$rm][$si:$sp] From unknown IP\n");
				send_reply(403,"Relay Forbidden");
				xlog("L_NOTICE","Auth error for $fU@$fd from $si (relay) cause -2");
				exit;
		}
	}
}

route[check_src_and_dest] {
	# Inbound from PSTN
	if (isflagset("PSTN")) {
		t_on_failure("gw_failover");
		setbflag("FS");
		if ( !ds_select_dst(1,4) ) {
			send_reply(500,"No Destination available");
			exit;
		}
	}
	# Outbound from WebRTC/SIP user → FreeSWITCH (keep X-MFDC-* for dialplan)
	else if (isflagset("DEV")) {
		# The extension's OWN call takes its line too: the counter is per line, not per direction, so a phone
		# that is dialling out must look busy to an incoming call. Same key as the delivery side — the
		# canonical extension and domain id from directory.devices.
		#
		# The key is CONCATENATED, not interpolated: OpenSIPS expands pseudo-variables in function arguments
		# but not on the right-hand side of an assignment, so "$var(a)@$var(b)" is stored verbatim — every
		# extension would then share one profile entry and the first call anywhere would make all of them look
		# busy. The neighbouring $var(fromuri)='sip:'+... is the shape to copy.
		#
		# Counted, never rejected: blocking a second OUTGOING call would break attended transfer, where the
		# operator consults a colleague while already on a call. The rejection belongs on the incoming side,
		# which then sees both of those dialogs.
		if (is_method("INVITE")) {
			$var(dev_ext) = $avp(ext);
			$var(dev_dom) = $avp(domain_id);
			if (($var(dev_ext) != NULL) && ($var(dev_ext) != "") && ($var(dev_dom) != NULL) && ($var(dev_dom) != "")) {
				$var(ext_aor) = $var(dev_ext) + "@" + $var(dev_dom);
				set_dlg_profile("ext_line", "$var(ext_aor)");
				xlog("L_NOTICE","[$time(%d/%m/%yT%H:%M:%S)][$ci][$route.name] ext_line $var(ext_aor): taken by an outgoing call\n");
			}
		}
		setbflag("FS");
		t_on_failure("gw_failover");
		if (!ds_select_dst(1,4)) {
			send_reply(500,"No Destination available");
			exit;
		}
	}
	# Outbound FS → PSTN trunk (strip internal headers, set PSTN flag for RTPengine codecs)
	else if ($(hdr(X-MFDC-Direction)[0]) == "outbound") {
		setbflag("PSTN");
		# Second trunk-bound signal, on purpose. route[is_not_register] already calls this for a leg tagged
		# with X-MFDC-Gateway-Id, but that tag is compiled into the bridge string when the schema is saved, so
		# a schema saved by an older mfdc-api has no tag and would keep leaking the internal socket. Calling
		# public_contact_addr twice is fine — set_advertised_address just sets the same value again.
		route(public_contact_addr);
		# From: when X-MFDC-Gateway-Id was present, is_not_register already rewrote it (flag GW_FROM) with the
		# trunk SIP domain / login. A second uac_replace_from here used to error ("already called") and, on
		# builds that allow a second call, would replace the trunk identity with sip:$fU@$td.
		if (!isflagset("GW_FROM")) {
			$var(fromuri)='sip:'+$fU+'@'+$td;
			uac_replace_from("", $var(fromuri));
		}
		route(strip_mfdc_headers);
		# Arms the failure route for THIS leg. Without it a 401/407 from the trunk is simply relayed back to
		# FreeSWITCH and the outbound-auth branch in gw_failover never runs — the other branches of this route
		# arm it themselves, this one did not, which is why outbound authentication looked like a no-op.
		t_on_failure("gw_failover");
	# Internal to user (device ↔ device via usrloc)
	} else if ($(hdr(X-MFDC-Direction)[0]) == "internal") {
		if (is_present_hf("X-MFDC-Uuid")) remove_hf("X-MFDC-Uuid");
		append_hf("X-MFDC-Uuid: $ci\r\n");
		# One line per extension. Counted here, at the proxy, because this is the single point every delivery
		# to an internal number passes — a direct call, a group bridge, a queue offer and a campaign leg all
		# arrive as this branch, and each of them would otherwise ring a phone that is already talking.
		#
		# INVITE only. MESSAGE reaches this branch too (the main route excludes it from record_route, not from
		# routing), and a chat message must not be refused because the person is on a call — nor may it try to
		# join a dialog profile, having no dialog of its own.
		#
		# The profile is keyed by the AOR being called, so it counts calls TOWARDS this extension only; the
		# extension's own outgoing call does not consume its line. 486 (and not 480/600) is what tells the
		# caller — and the ACD, which then moves to the next operator — that the party is busy rather than
		# gone. The line is taken AFTER the check, so a call is never counted against itself, and it is
		# released when the dialog ends — including a call that only rang, since the dialog is created on the
		# INVITE and destroyed when the transaction fails.
		if (is_method("INVITE")) {
			# Keyed by extension + DOMAIN ID, not by the domain name. Internal legs are dialled at
			# SIPDomainForTenant(), which returns the platform-wide webrtc_sip_domain when one is configured,
			# while the extension's own outgoing call carries its directory domain — keying by name would put
			# the two directions of one line into two different buckets, and the whole point is that they share
			# one. The id travels in X-MFDC-Domain-Id on every internal leg; $rd is the fallback for a leg built
			# before that header existed.
			$var(ext_dom) = $(hdr(X-MFDC-Domain-Id));
			if (($var(ext_dom) == NULL) || ($var(ext_dom) == "")) {
				$var(ext_dom) = $rd;
			}
			$var(ext_aor) = $rU + "@" + $var(ext_dom);
			get_profile_size("ext_line", "$var(ext_aor)", $var(ext_lines));
			# Logged for EVERY delivery, not only for a rejection: "the limit does not work" has three causes
			# and only this line tells them apart — no line at all means the request never reached this branch,
			# 0 while the phone is busy means the other call is not in the profile, and >0 means the gate works
			# and the call that got through arrived another way.
			xlog("L_NOTICE","[$time(%d/%m/%yT%H:%M:%S)][$ci][$route.name] ext_line $var(ext_aor): $var(ext_lines) in use\n");
			if ($var(ext_lines) > 0) {
				send_reply(486,"Busy Here");
				exit;
			}
			set_dlg_profile("ext_line", "$var(ext_aor)");
		}
		# Webitel hotdesk (directory.wbt_*) removed — MFDC uses directory.devices + usrloc only.
		lookup("location","method-filtering");
		if ($retcode < 0 ) {
            send_reply(480,"Subscriber absent");
            exit;
		}
	} else {
		setbflag("FS");
		t_on_failure("gw_failover");
		if (!ds_select_dst(1,4) ) {
			send_reply(500,"No Destination available");
			exit;
		}
	}
}

route[check_limits] {
# Legacy Webitel call_center.cc_calls — not used in MFDC (callers commented out).
# Keep route as no-op so accidental route(check_limits,...) does not break DB.
	$avp(channels) = 0;
	xlog("L_DBG", "SCRIPT:DBG check_limits domain=$param(1) channels=0 (noop)\n");
}

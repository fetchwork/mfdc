#### DISPATCHER module
loadmodule "dispatcher.so"
modparam("dispatcher", "db_url", "virtual://mfdc")
modparam("dispatcher", "ds_ping_method", "OPTIONS")
# From URI of the probing OPTIONS. The default (sip:dispatcher@localhost) is what several providers answer
# with 404 — an unknown AOR in their AOR space. Kept in the accepted options_reply_codes below either way,
# but a recognisable From makes the probe readable in the provider's logs.
modparam("dispatcher", "ds_ping_from", "sip:mfdc@localhost")
# Sets 2 and 3 are probe-only: nothing is routed through them (ds_select_dst uses set 1, and only sets listed
# in ds_probing_list are pinged at all). Set 2 holds one destination per SIP gateway, kept in sync by mfdc-api
# together with the OpenSIPS address/registrant rows.
# ds_probing_mode 1 = ping every destination of a probed set, not only the ones already marked down — that is
# what makes a working trunk going silent detectable at all. The per-row probe_mode = 1 written by the sync
# says the same thing at destination level, so the two agree no matter which one the build honours.
#
# Set 1 (FreeSWITCH nodes) IS probed since 2026-08-23 — this is what makes inbound failover automatic.
# Before that only the outbound half was: originate picks a node through RankFSNodes, which requires
# fs_node_runtime.status = 'up' (mfdc-runner probes ESL every 10s), while ds_select_dst(1,4) kept handing
# inbound calls to a dead node until an admin flipped fs_nodes.enabled by hand. mfdc-api rebuilds set 1 from
# fs_nodes.enabled only — a crash does not change that flag, so the proxy has to notice on its own.
#
# WHAT THIS COSTS: an unanswered OPTIONS now takes a node OUT of inbound routing. FreeSWITCH answers OPTIONS
# from mod_sofia by default and the shipped profile leaves apply-inbound-acl commented out, so the ping goes
# through — but a node with a hand-added ACL, or a profile bound to another address, would be declared down
# while calls still work. Verify on the stand before this reaches production:
#   opensips-cli -x mi ds_list          # every FS destination of set 1 must read "Active"
# ds_probing_threshold 2 below means ~60s of missed pings before a node is dropped, and recovery is picked
# up on the first answered ping.
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_probing_list", "1,2,3")
modparam("dispatcher", "ds_ping_interval", 30)
# 2 unanswered OPTIONS in a row (~60s) before a trunk is declared down: one lost UDP packet must not raise an
# alert, but the operator should not wait minutes either. Recovery is reported on the first answered ping.
modparam("dispatcher", "ds_probing_threshold", 2)
# What counts as "the trunk answered". By default ONLY 200 does, and plenty of providers reply to an OPTIONS
# from an unknown AOR with 404/403/401 — that is still proof the host is alive and talking SIP, so without
# this the trunk would sit at "unreachable"/"no data" forever while calls go through fine. Any final response
# means reachable; add more codes here if a provider answers with something else.
modparam("dispatcher", "options_reply_codes", "200,401,403,404")


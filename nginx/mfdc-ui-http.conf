# Bootstrap UI without TLS (first install / lab).
# Replace with mfdc-ui.conf + Let's Encrypt for production.
#
#   cp install/nginx/mfdc-api-proxy.conf /etc/nginx/snippets/
#   cp install/nginx/mfdc-ui-http.conf /etc/nginx/sites-available/mfdc-ui.conf
#   ln -sf /etc/nginx/sites-available/mfdc-ui.conf /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=mfdc_auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mfdc_auth_refresh:10m rate=30r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/mfdc-ui;
    index index.html;
    client_max_body_size 64m;

    location = /api/media/upload {
        client_max_body_size 512m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8001/api/media/upload;
        include /etc/nginx/snippets/mfdc-api-proxy.conf;
    }

    # OpenSIPS WebSocket (proto_ws :6070). UI webrtc_wss_url → wss://host/wss/
    location /wss/ {
        proxy_pass http://127.0.0.1:6070;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/auth/login {
        limit_req zone=mfdc_auth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/mfdc-api-proxy.conf;
    }

    location = /api/auth/refresh {
        limit_req zone=mfdc_auth_refresh burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/mfdc-api-proxy.conf;
    }

    location ~ ^/api/cdr/[0-9]+/record$ {
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/mfdc-api-proxy.conf;
    }

    # Service-key ручки broker -> api: "internal" в пути — только имя, location /api/ ниже
    # проксирует ВСЁ. Брокер ходит в api напрямую, минуя nginx (см. mfdc-ui.conf).
    location ^~ /api/internal/ {
        deny all;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        include /etc/nginx/snippets/mfdc-api-proxy.conf;
    }

    location ^~ /media/play {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /media/preview {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /media/sync {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ACME / Let's Encrypt (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Hashed Vite chunks: never fall back to index.html (MIME text/html on .js).
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

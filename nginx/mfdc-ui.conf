# TelBI MFDC UI + API reverse proxy (mfdc-api :8001)
#
# Install:
#   cp install/nginx/mfdc-ui.conf /etc/nginx/sites-available/mfdc-ui.conf
#   ln -s /etc/nginx/sites-available/mfdc-ui.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Build UI: cd ui && npm run build
# Deploy:   rsync -a ui/dist/ /var/www/mfdc-ui/

limit_req_zone $binary_remote_addr zone=mfdc_auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mfdc_auth_refresh:10m rate=30r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name mfdc.example.com;

    ssl_certificate     /etc/letsencrypt/live/mfdc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mfdc.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mfdc-ui;
    index index.html;

    client_max_body_size 64m;

    # Sound library uploads (limit should be >= sounds.max_upload_mb in platform settings, max 512).
    location = /api/media/upload {
        client_max_body_size 512m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8001/api/media/upload;
        include /etc/nginx/snippets/mfdc-api-proxy.conf;
    }

    # Security headers (static UI + SPA fallback)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss: stun: turn:; upgrade-insecure-requests" always;

    # WebRTC WSS → OpenSIPS proto_ws (:6070). UI webrtc_wss_url must match this path.
    location /wss/ {
        proxy_pass http://127.0.0.1:6070;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/auth/login {
        limit_req zone=mfdc_auth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/mfdc-api-proxy.conf;
    }

    location = /api/auth/refresh {
        limit_req zone=mfdc_auth_refresh burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/mfdc-api-proxy.conf;
    }

    # CDR recordings: stream with Range (no proxy buffering)
    location ~ ^/api/cdr/[0-9]+/record$ {
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/mfdc-api-proxy.conf;
    }

    # Service-key ручки broker -> api. "internal" в пути — только имя: location /api/ ниже
    # проксирует ВСЁ, поэтому снаружи они были достижимы и защищены одним X-MFDC-Key.
    # Брокер ходит в api напрямую (не через nginx), так что закрытие ничего не ломает.
    # ^~ выигрывает у префикса /api/ и у regex-локаций.
    location ^~ /api/internal/ {
        deny all;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        include /etc/nginx/snippets/mfdc-api-proxy.conf;
    }

    # mfdc-runner streams (exact prefixes — do NOT catch SPA route /media)
    location ^~ /media/play {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /media/preview {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /media/sync {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Hashed Vite chunks: never fall back to index.html (that is text/html and
    # Chrome then reports "Expected a JavaScript module … MIME type of text/html").
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA shell must revalidate after every ui/dist rsync --delete.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name mfdc.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
